# MySQL / Redis 使用宿主机已有实例，不再由本编排启动。
# 容器内 127.0.0.1 指向容器自身；默认通过 host.docker.internal 访问宿主机数据库。
# 若数据库在局域网其它机器，在 .env 中把 MYSQL_HOST / REDIS_HOST 改为对应地址。
services:
  web:
    container_name: Eco-web
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_URL: http://server:1280
    environment:
      API_URL: http://server:1280
    restart: always
    ports:
      - ${WEB_PORT:-1281}:1281
    networks:
      - Eco-network
    depends_on:
      server:
        condition: service_healthy

  server:
    container_name: Eco-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: ${PORT:-1280}
      JWT_SECRET: ${JWT_SECRET:-ecohub_2026!local@dev_secret$$001}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-eco}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecohub}
      MYSQL_DBNAME: ${MYSQL_DBNAME:-eco}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ecohub}
      REDIS_DB: ${REDIS_DB:-0}
      ECOHUB_ADMIN_PASSWORD: ${ECOHUB_ADMIN_PASSWORD:-admin}
    ports:
      - 0.0.0.0:${SERVER_PORT:-1280}:${PORT:-1280}
    volumes:
      - eco-server-uploads:/app/static/upload
    networks:
      - Eco-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${PORT:-1280}/api/config/basic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  Eco-network:
    driver: bridge

volumes:
  eco-server-uploads:
